<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bridge Builder</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, sans-serif; }
  body { background: #1e293b; color: #f8fafc; display: flex; flex-direction: column; align-items: center; height: 100vh; overflow: hidden; }
  #bar { width: 100%; max-width: 900px; display: flex; justify-content: space-between; align-items: center; padding: 10px 14px; background: #0f172a; border-bottom: 2px solid #334155; flex-wrap: wrap; gap: 6px; }
  .row { display: flex; gap: 6px; align-items: center; }
  button { padding: 8px 12px; border: none; border-radius: 6px; font-weight: 700; cursor: pointer; background: #334155; color: #f8fafc; }
  button.active { background: #3b82f6; color: #fff; }
  button.go { background: #10b981; color: #064e3b; }
  button.stop { background: #ef4444; color: #fff; }
  #info { font-size: 14px; font-weight: 700; display: flex; gap: 14px; }
  canvas { background: linear-gradient(180deg, #bae6fd 0%, #e0f2fe 70%, #0284c7 70%, #0369a1 100%); width: 100%; max-width: 900px; flex: 1; touch-action: none; }
  #tip { position: absolute; top: 70px; background: rgba(15, 23, 42, 0.9); padding: 8px 16px; border-radius: 8px; font-weight: 600; pointer-events: none; border: 1px solid #475569; }
</style>
</head>
<body>
<div id="bar">
  <div class="row">
    <button id="b-road" class="active" onclick="pick('road')">Road ($100)</button>
    <button id="b-wood" onclick="pick('wood')">Wood ($60)</button>
    <button id="b-steel" onclick="pick('steel')">Steel ($150)</button>
    <button id="b-erase" onclick="pick('erase')">Erase</button>
  </div>
  <div id="info">
    <span id="lvl">Level 1/3</span>
    <span id="cash">Budget: $2200</span>
  </div>
  <div class="row">
    <button id="b-sim" class="go" onclick="toggle()">▶ Test</button>
    <button onclick="load(lvl)">Clear</button>
  </div>
</div>
<div id="tip">Drag from a red anchor dot to build a bridge!</div>
<canvas id="c"></canvas>
<script src="game.js"></script>
</body>
</html>
